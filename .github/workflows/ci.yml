name: Package and portable workflow
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      encoder_smoke:
        description: 'Download pinned official weights and encode ten artificial contigs'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools and CPU attention runtime
        run: |
          python -m pip install -c requirements.txt setuptools wheel
          python -m pip install -c requirements.txt torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build and install wheel with pinned dependencies
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python -m pip install -c requirements.txt "$(ls dist/bincomplete-*.whl)[dev,embeddings]"
          python -m pip check
      - name: Test installed wheel and portable CLI
        run: |
          python -m bincomplete --version
          python -m bincomplete doctor --device cpu
          python -m pytest -q
          python tools/smoke_installed.py --output ci-smoke
          python -m bincomplete demo --output ci-demo
          python -m bincomplete demo --output ci-demo
          python -m ruff check src tests tools
          python -m ruff format --check src tests tools
          python -m mypy
          python tools/check_release.py --root .
  source-distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build and inspect source distribution
        run: |
          python -m pip install -c requirements.txt setuptools wheel build
          python -m build --sdist --no-isolation --outdir dist .
          python tools/check_distribution.py --root . --sdist "$(ls dist/bincomplete-*.tar.gz)"
      - name: Install and test the extracted distribution
        run: |
          python -m pip install -c requirements.txt torch --index-url https://download.pytorch.org/whl/cpu
          python -m tarfile --extract "$(ls dist/bincomplete-*.tar.gz)" ci-source
          cd ci-source/bincomplete-*
          python tools/check_release.py --root .
          python -m pip install --no-build-isolation -c requirements.txt ".[dev,sets,embeddings]"
          python -m pip check
          python run.py --version
          python -m bincomplete --version
          python -m pytest -q
          python tools/smoke_installed.py --output ci-sdist-smoke
  encoder:
    if: github.event_name == 'workflow_dispatch' && inputs.encoder_smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install wheel in clean CPU environment
        run: |
          python -m pip install -c requirements.txt setuptools wheel
          python -m pip install -c requirements.txt torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python -m pip install -c requirements.txt "$(ls dist/bincomplete-*.whl)[embeddings]"
          python -m pip check
      - name: Explicitly install pinned upstream model and test raw FASTA encoding
        run: |
          python -m bincomplete models install dnabert_s --output ci-encoder-weights
          python tools/smoke_encoder.py --encoder-path ci-encoder-weights --output ci-encoder-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: encoder-smoke-${{ matrix.os }}
          path: |
            ci-encoder-run/encoder_smoke_result.json
            ci-encoder-run/preflight.json
            ci-encoder-run/experiment.json
